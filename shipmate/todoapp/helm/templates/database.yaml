apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.app.name }}-db
  namespace: {{ .Values.app.namespace }}
spec:
  selector:
    app: {{ .Values.app.name }}-db
  ports:
    - port: {{ .Values.db.port }}
      targetPort: {{ .Values.db.port }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.app.name }}-db
  namespace: {{ .Values.app.namespace }}
spec:
  serviceName: {{ .Values.app.name }}-db
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.app.name }}-db
  template:
    metadata:
      labels:
        app: {{ .Values.app.name }}-db
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: root
            - name: MYSQL_DATABASE
              value: app
            - name: MYSQL_USER
              value: app
            - name: MYSQL_PASSWORD
              value: app
                          ports:
            - containerPort: {{ .Values.db.port }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.db.storage }}
