image:
  repository: ghcr.io/mojojojo0222/todoapp
  tag: f2897c6d6241ebd68ee5c1c9eccfde846938c9da
  pullPolicy: Always

app:
  name: todoapp
  namespace: shipmate-todoapp
  replicas: 1
  port: 8080
  serviceType: NodePort
  healthPath: /actuator/health
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 300m
      memory: 512Mi
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 2
    cpuTarget: 60

db:
  engine: mysql
  storage: 20Gi
  port: 3306
