image:
  repository: ghcr.io/mojojojo0222/todoapp
  tag: 5d0b87c1f3330dcc8134b0a83042f6cecafa1c2b
  pullPolicy: Always

app:
  name: todoapp
  namespace: shipmate-todoapp
  replicas: 1
  port: 8080
  serviceType: ClusterIP
  healthPath: /actuator/health
  resources:
    requests:
      cpu: 500m
      memory: 1024Mi
    limits:
      cpu: 1000m
      memory: 1536Mi
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 2
    cpuTarget: 60

db:
  engine: mysql
  storage: 20Gi
  port: 3306
