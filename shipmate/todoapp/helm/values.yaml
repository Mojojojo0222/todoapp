image:
  repository: ghcr.io/mojojojo0222/todoapp
  tag: f912ec37cdd5ce2f26603632ae5ffb02dcb1c8f8
  pullPolicy: Always

app:
  name: todoapp
  namespace: shipmate-todoapp
  replicas: 1
  port: 8080
  serviceType: LoadBalancer
  healthPath: /actuator/health
  resources:
    requests:
      cpu: 500m
      memory: 1024Mi
    limits:
      cpu: 1000m
      memory: 1536Mi
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 2
    cpuTarget: 60

db:
  engine: mysql
  storage: 20Gi
  port: 3306
